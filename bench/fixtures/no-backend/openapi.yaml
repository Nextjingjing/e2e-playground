openapi: 3.0.3
info: { title: Orders API, version: 1.4.0 }
paths:
  /orders:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    delete:
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: cancelled }, "409": { description: already shipped } }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        pickedAt: { type: string, format: date-time }
